<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pick a mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      :root {
        --bg: #0a0a0a;
        --line: #262626;
        --green: #1db954;
        --green-bright: #2fe573;
        --text: #f5f5f0;
        --text-muted: #8f8f8f;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        overflow-x: hidden;
        min-height: 100vh;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }

      /* ---------- ambient equalizer backdrop ---------- */
      .eq-backdrop {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 6px;
        padding-bottom: 0;
        opacity: 0.05;
        pointer-events: none;
        z-index: 0;
      }
      .eq-backdrop span {
        width: 14px;
        background: var(--green);
        animation: eqmove 1.8s ease-in-out infinite;
      }
      @keyframes eqmove {
        0%,
        100% {
          height: 20px;
        }
        50% {
          height: 220px;
        }
      }

      /* ---------- layout ---------- */
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 1080px;
        margin: 0 auto;
        padding: 64px 32px 100px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 56px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--green);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .brand-mark svg {
        width: 20px;
        height: 20px;
      }
      .brand-name {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 0.02em;
        color: var(--text);
      }
      .brand-name span {
        color: var(--green);
      }

      .tagline-pill {
        font-size: 12px;
        color: var(--text-muted);
        border: 1px solid var(--line);
        padding: 6px 14px;
        border-radius: 99px;
        display: none;
      }
      @media (min-width: 640px) {
        .tagline-pill {
          display: block;
        }
      }

      .hero h1 {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: clamp(36px, 6vw, 64px);
        line-height: 1.02;
        letter-spacing: -0.02em;
        max-width: 780px;
      }
      .hero h1 em {
        font-style: normal;
        color: var(--green);
      }
      .hero p {
        margin-top: 18px;
        font-size: 17px;
        color: var(--text-muted);
        max-width: 480px;
        line-height: 1.5;
      }

      /* ---------- grid of mode tiles ---------- */
      .grid {
        margin-top: 56px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }
      @media (min-width: 720px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .tile {
        position: relative;
        border-radius: 18px;
        padding: 28px;
        min-height: 240px;
        overflow: hidden;
        cursor: pointer;
        border: 1px solid transparent;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        text-decoration: none;
        color: inherit;
        transition:
          transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 0.35s ease;
        -webkit-tap-highlight-color: transparent;
        isolation: isolate;
      }
      .tile:focus-visible {
        outline: 2px solid var(--green-bright);
        outline-offset: 3px;
      }
      .tile:hover,
      .tile:focus-visible {
        transform: translateY(-6px);
        box-shadow: 0 24px 48px -20px rgba(0, 0, 0, 0.6);
      }
      .tile:active {
        transform: translateY(-2px) scale(0.99);
      }

      /* base color layer - always visible, this is the fallback if the image is missing */
      .tile-base {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      /* photo layer, blended into the base gradient so any dropped-in image inherits the mode's palette */
      .tile-media {
        position: absolute;
        inset: -4%;
        width: 108%;
        height: 108%;
        background-size: cover;
        background-position: center;
        mix-blend-mode: overlay;
        opacity: 0.95;
        filter: saturate(1.15) contrast(1.05);
        transform: scale(1.06);
        transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        z-index: 1;
      }
      .tile:hover .tile-media {
        transform: scale(1.14);
      }

      .tile-scrim {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.08) 0%,
          rgba(0, 0, 0, 0.35) 55%,
          rgba(0, 0, 0, 0.82) 100%
        );
      }

      /* rotated corner sticker */
      .sticker {
        position: absolute;
        top: -26px;
        right: -26px;
        width: 110px;
        height: 110px;
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: rotate(18deg);
        transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        z-index: 3;
      }
      .tile:hover .sticker {
        transform: rotate(8deg) scale(1.06);
      }
      .sticker svg {
        width: 38px;
        height: 38px;
        transform: rotate(-18deg);
      }

      .tile-content {
        position: relative;
        z-index: 3;
      }
      .tile-eyebrow {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0.75);
        margin-bottom: 8px;
        font-weight: 600;
      }
      .tile-title {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 28px;
        line-height: 1.05;
        margin-bottom: 8px;
      }
      .tile-desc {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
        max-width: 320px;
        line-height: 1.4;
        margin-bottom: 6px;
      }
      .tile-route {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.45);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .tile-route svg {
        width: 11px;
        height: 11px;
        opacity: 0.8;
      }

      .play-btn {
        position: absolute;
        right: 20px;
        bottom: 20px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--green);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 4;
        opacity: 0;
        transform: translateY(8px) scale(0.9);
        transition:
          opacity 0.3s ease,
          transform 0.3s ease,
          background 0.2s ease;
      }
      .tile:hover .play-btn,
      .tile:focus-visible .play-btn {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .play-btn:hover {
        background: var(--green-bright);
      }
      .play-btn svg {
        width: 18px;
        height: 18px;
      }

      footer {
        margin-top: 64px;
        text-align: center;
        font-size: 12px;
        color: #5c5c5c;
      }
    </style>
  </head>
  <body>
    <div class="eq-backdrop" aria-hidden="true">
      <span style="animation-delay: 0s"></span>
      <span style="animation-delay: 0.15s"></span>
      <span style="animation-delay: 0.3s"></span>
      <span style="animation-delay: 0.45s"></span>
      <span style="animation-delay: 0.6s"></span>
      <span style="animation-delay: 0.75s"></span>
      <span style="animation-delay: 0.9s"></span>
    </div>

    <div class="wrap">
      <header>
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M4 14c4-2 12-2 16 0M5 10.5c5-2 9-2 14 0M6.5 7c4-1.4 7-1.4 11 0"
                stroke="#0a0a0a"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div class="brand-name">play<span>mode</span></div>
        </div>
        <div class="tagline-pill">made by yours truly, Wassim</div>
      </header>

      <div class="hero">
        <h1>Pick your <em>mode</em>.</h1>
        <p>
          Guess it, rank it, or settle it head to head — four ways to prove you
          know music better than everyone else.
        </p>
      </div>

      <div class="grid" id="grid"></div>
    </div>

    <script src="../script.js"></script>
    <script src="index.js"></script>
  </body>
</html>
