<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPOTIMATCH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="spotimatch.css" />
  </head>
  <body>
    <header id="topbar">
      <div class="wordmark">SPOTI<span class="wordmark-dle">MATCH</span></div>

      <div id="playMode" role="tablist" aria-label="Play mode">
        <div id="playModeSlider"></div>
        <button
          class="play-mode-option"
          data-mode="in order"
          role="tab"
          aria-selected="false"
          type="button"
        ></button>
        <button
          class="play-mode-option active"
          data-mode="random"
          role="tab"
          aria-selected="true"
          type="button"
          title="Swipping fast in random mode may take longer to load the next track"
        ></button>
      </div>
      <button id="quitCuratingBtn" class="quit-btn" hidden>
        Confirm choices
      </button>
    </header>
    <div class="loading-overlay" id="loadingOverlay" hidden>
      <div id="vinyl" aria-hidden="true"></div>
      <p id="loading-text">
        Loading<span class="dots"
          ><span>.</span><span>.</span><span>.</span></span
        >
      </p>
    </div>
    <div class="scene">
      <!-- LIBRARY — the initial view. Only this shows at boot. -->
      <div class="toast-container" id="toastContainer"></div>

      <section class="library" id="library">
        <div class="library-header">
          <button class="crumb-back" id="libraryBack" hidden>← back</button>
          <div class="breadcrumb" id="breadcrumb"></div>
          <button
            class="shuffle-btn"
            id="shuffleBtn"
            title="Pick a random playlist"
          >
            <svg
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M17 3l4 4-4 4M3 7h6l2 2M17 21l4-4-4-4M3 17h6l2-2M13 13l4 4M13 11l4-4"
              />
            </svg>
            shuffle
          </button>
        </div>

        <div class="library-search">
          <input
            type="text"
            id="librarySearch"
            placeholder="search loaded playlists & folders…"
            autocomplete="off"
          />
        </div>

        <div class="library-url-row">
          <input
            type="text"
            id="playlistUrlInput"
            placeholder="or paste a playlist link…"
            autocomplete="off"
          />
          <button class="url-load-btn" id="playlistUrlBtn">load</button>
        </div>

        <div class="library-grid" id="libraryGrid"></div>
        <div class="library-empty" id="libraryEmpty" hidden>
          this folder is empty
        </div>
        <button id="backToTopBtn" aria-label="Back to top" title="Back to top">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5L5.5 11.5L7 13l4-4v10h2V9l4 4 1.5-1.5L12 5z" />
          </svg>
        </button>
      </section>

      <section class="game" id="gameSection" hidden>
        <div id="cardDeck" class="card-deck"></div>
        <div class="card-controls">
          <button id="btnRemove" class="ctrl-btn remove-btn">✕</button>
          <button id="btnLike" class="ctrl-btn like-btn">♥</button>
          <button id="btnKeep" class="ctrl-btn keep-btn">✓</button>
        </div>
      </section>
    </div>

    <div id="confirmModal" class="modal-overlay" hidden>
      <div class="modal-content">
        <p id="confirmText"></p>
        <div class="modal-actions">
          <button id="confirmYes" class="modal-btn green-btn">Yes</button>
          <button id="confirmNo" class="modal-btn gray-btn">No</button>
        </div>
      </div>
    </div>

    <audio id="audio" preload="none" loop></audio>

    <script src="../script.js"></script>
    <script src="spotimatch.js"></script>
  </body>
</html>
