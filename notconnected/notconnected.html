<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not Connected to Spotify</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: white;
      }

      .card {
        background: #121212;
        padding: 40px;
        border-radius: 16px;
        text-align: center;
        width: 90%;
        max-width: 420px;
        box-shadow: 0 0 30px rgba(29, 185, 84, 0.25);
      }

      .logo {
        width: 80px;
        height: 80px;
        background: #1db954;
        border-radius: 50%;
        margin: 0 auto 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 45px;
        font-weight: bold;
        color: black;
      }

      h1 {
        font-size: 26px;
        margin-bottom: 15px;
      }

      p {
        color: #b3b3b3;
        line-height: 1.5;
        margin-bottom: 25px;
      }

      a {
        display: inline-block;
        background: #1db954;
        color: black;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 30px;
        font-weight: bold;
        transition: 0.2s;
      }

      a:hover {
        background: #1ed760;
        transform: scale(1.05);
      }
      .spotify-button {
        background: #1db954;
        color: #000;
        border: none;
        padding: 14px 28px;
        border-radius: 30px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .spotify-button:hover {
        background: #1ed760;
        transform: scale(1.05);
      }

      .spotify-button:active {
        transform: scale(0.98);
      }
    </style>
  </head>

  <body>
    <div class="card" id="content">
      <div class="logo">♪</div>

      <h1>You are not connected to Spotify</h1>

      <a
        href="https://accounts.spotify.com/en/login?continue=https%3A%2F%2Fopen.spotify.com%2F"
        target="_blank"
      >
        Open Spotify
      </a>

      <p>
        Please open Spotify and connect your account. Once connected, click the
        button below to reload the extension or restart your browser.
      </p>

      <button class="spotify-button" id="extensionPage">
        Reload extension
      </button>
    </div>

    <script src="../script.js"></script>
    <script src="notconnected.js"></script>
  </body>
</html>
